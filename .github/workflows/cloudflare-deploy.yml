name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'dr-swipe/package-lock.json'

      - name: Validate clinical cases
        run: python3 tools/validate_cases.py dr-swipe/public/cases

      - name: Install dependencies
        run: cd dr-swipe && npm ci

      # `npm run build` runs `tsc -b` first, so type regressions fail CI here.
      - name: Build
        run: cd dr-swipe && npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dr-swipe/dist --project-name=dr-swipe-specs
