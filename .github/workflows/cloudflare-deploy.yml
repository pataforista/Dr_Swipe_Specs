name: Deploy to Cloudflare Pages

on:
  # Validate every branch; deploy only from main/master (see the last step).
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'dr-swipe/package-lock.json'

      - name: Validate clinical cases
        run: python3 tools/validate_cases.py cases

      # Fail if a manual edit undid a guideline correction, reintroduced an
      # answer leak, or removed an inserted distractor.
      - name: Check content corrections are applied
        run: |
          python3 tools/apply_guideline_review.py cases --check
          python3 tools/clean_card_leaks.py cases --check
          python3 tools/apply_clinical_review_2026_10.py --check
          for f in content_drafts/distractores_lote*.json; do
            python3 tools/insert_distractors.py cases "$f" --check
          done

      - name: Install dependencies
        run: cd dr-swipe && npm ci

      - name: Run tests
        run: cd dr-swipe && npm test

      # `npm run build` runs `tsc -b` first, so type regressions fail CI here.
      - name: Build
        run: cd dr-swipe && npm run build
        env:
          # Public DSN (a repository variable, not a secret). Unset = no reporting.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dr-swipe/dist --project-name=dr-swipe-specs
