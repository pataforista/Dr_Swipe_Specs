<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Swipe: Clinical Investigation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- View: Intake (Start Screen) -->
        <div id="view-intake" class="view active">
            <h1 class="title">Dr. Swipe</h1>
            <p class="subtitle">Clinical Investigation</p>
            <div id="case-framing" class="framing-text">
                <!-- Content injected by JS -->
            </div>
            <button id="btn-start" class="btn primary">Comenzar revisión</button>
        </div>

        <!-- View: Evidence Stream (Game Loop) -->
        <div id="view-stream" class="view hidden">
            <header class="game-header">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
                <div class="stats">
                    <span id="counter-kept">Guardados: 0</span>
                    <span id="counter-discarded">Descartados: 0</span>
                </div>
            </header>
            
            <main class="card-container">
                <div id="card-stack" class="card-stack">
                    <!-- Current card goes here -->
                </div>
            </main>

            <footer class="controls">
                <button id="btn-discard" class="btn-circle discard">✖</button>
                <button id="btn-annotate" class="btn-small">📝</button>
                <button id="btn-keep" class="btn-circle keep">✔</button>
            </footer>
        </div>

        <!-- View: Checkpoint -->
        <div id="view-checkpoint" class="view hidden">
            <h2>Punto de Decisión</h2>
            <p id="checkpoint-message">El sistema evalúa la suficiencia de la evidencia...</p>
            <button id="btn-checkpoint-continue" class="btn primary">Continuar</button>
        </div>

        <!-- View: Results/Dossier -->
        <div id="view-results" class="view hidden">
            <h2>Expediente Final</h2>
            <div id="result-status" class="result-box"></div>
            
            <div class="dossier-lists">
                <div class="list-section">
                    <h3>Evidencia Guardada</h3>
                    <ul id="list-kept"></ul>
                </div>
                <div class="list-section">
                    <h3>Evidencia Descartada</h3>
                    <ul id="list-discarded"></ul>
                </div>
            </div>
            
            <button id="btn-restart" class="btn secondary">Volver al Inicio</button>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
